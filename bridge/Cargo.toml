[package]
name = "mod-sentinel"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Sentinel's trait-mod half: the bridge to the horizon-citizens NPC library"

# `citizens` (horizon-citizens' api package) is added by the launcher from the bundle's
# `[dependencies]`; do not declare it here (docs/native-mods.md, "Dependencies between trait mods").
[dependencies]
# The launcher points this at the Horizon source it builds the game from.
horizon-client = { git = "https://github.com/horizon-rust/horizon", rev = "a589a3dd9be04fa7f17667c0175711aaa92e1147" }
