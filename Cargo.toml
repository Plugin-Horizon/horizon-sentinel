[package]
name = "mod-sentinel"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
# Both are in Horizon's Cargo.lock at the pinned commit.
regex = "1.13"
toml = "1.1"
serde_json = "1"

